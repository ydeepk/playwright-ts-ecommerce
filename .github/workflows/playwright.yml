# ==============================================================================
# Pipeline: Playwright Multi-Stage E2E Test Execution & Reporting
# Maintainer: Automation QA Team
# Architecture Overview:
#   1. Selective Triggering (PR vs Push vs Schedule vs Manual)
#   2. Parallel Matrix Sharding for Execution Speed
#   3. Consolidated Allure History & Single-Source-of-Truth Deployment
#   4. Dynamic Metrics Extraction & Stakeholder Notification
# ==============================================================================

name: Playwright Test Pipeline

on:
  # Enables manual execution via GitHub UI/API for ad-hoc testing
  workflow_dispatch:

  # Quality Gate: Runs fast smoke suite on PRs targeting main/master
  pull_request:
    branches: [main, master]

  # Regression Gate: Runs multi-browser suite on merge to main/master
  push:
    branches: [main, master]

  # Scheduled Audit: Full test suite execution (Tue/Thu at 02:00 UTC)
  schedule:
    - cron: "0 2 * * 2,4"

# Prevent concurrent runs on the same branch from stepping on each other's 
# deployment state while conserving CI runner quota.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

# Granular GITHUB_TOKEN permissions required for GitHub Pages publishing
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: SMOKE TESTS (PR Gate)
  # Target execution time: < 10 mins via 2-way sharding
  # ============================================================================
  smoke-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false # Ensures failure in shard 1 doesn't terminate shard 2 prematurely
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Cache Playwright browser binaries to accelerate setup across workflow runs
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps

      - name: Clean Allure Results
        run: rm -rf allure-results && mkdir allure-results

      - name: Run Smoke Tests
        run: |
          npx playwright test --retries=1 \
          --project=smoke-chromium \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Attaches defect classification rules to raw result set
      - name: Copy Allure Categories
        if: always()
        run: |
          mkdir -p allure-results 
          cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        run: |
          if [ ! -d "allure-results" ]; then
            echo "Allure results missing - failing job"
            exit 1
          fi

      # Upload raw Allure XML/JSON data for downstream aggregation in merge-report
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      # Upload native Playwright HTML report artifacts for direct log debugging
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-smoke-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 60

  # ============================================================================
  # JOB 2: REGRESSION TESTS (Post-Merge Validation)
  # Cross-browser matrix execution sharded 3 ways
  # ============================================================================
  regression-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps

      - name: Clean Allure Results
        run: rm -rf allure-results && mkdir allure-results

      - name: Run Regression Tests
        run: |
          npx playwright test --retries=1 \
          --project=regression-chromium \
          --project=regression-firefox \
          --project=regression-webkit \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Copy Allure Categories
        if: always()
        run: cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        run: |
          if [ ! -d "allure-results" ]; then
            echo "Allure results missing - failing job"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: regression-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-regression-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 60

  # ============================================================================
  # JOB 3: NIGHTLY FULL SUITE (Scheduled Health Check)
  # Deep-coverage execution sharded 4 ways
  # ============================================================================
  nightly-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps

      - name: Clean Allure Results
        run: rm -rf allure-results && mkdir allure-results

      - name: Run Full Suite
        run: |
          npx playwright test --retries=1 \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Copy Allure Categories
        if: always()
        run: cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        run: |
          if [ ! -d "allure-results" ]; then
            echo "Allure results missing - failing job"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nightly-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-nightly-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 60

  # ============================================================================
  # JOB 4: REPORT CONSOLIDATION & PUBLISHING
  # Merges raw results across shards and deploys live Allure Dashboard to gh-pages.
  # acts as the single source of truth for deployments to eliminate race conditions.
  # ============================================================================
  merge-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - smoke-tests
      - regression-tests
      - nightly-tests

    # Executes if at least one upstream execution job ran (ignoring skipped jobs)
    if: >
      always() &&
      !cancelled() &&
      (
        needs.smoke-tests.result != 'skipped' ||
        needs.regression-tests.result != 'skipped' ||
        needs.nightly-tests.result != 'skipped'
      )

    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v5

      # Wildcard pattern matches results regardless of which stage ran (smoke/regression/nightly)
      - name: Download all results
        uses: actions/download-artifact@v5
        with:
          pattern: "*-allure-*"
          path: all-results
          merge-multiple: true

      # Guard step prevents generating corrupt empty reports if test execution aborted early
      - name: Validate Allure Results Exist
        run: |
          if [ ! -d "all-results" ] || [ -z "$(ls -A all-results)" ]; then
            echo "No Allure results found. Skipping report generation."
            exit 0
          fi

      # Compiles static HTML dashboard incorporating history trend points
      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: all-results
          gh_pages: gh-pages
          subfolder: allure-results
          allure_report: allure-report
          allure_history: allure-history
          allure_version: 2.29.0
          keep_reports: 30

      # Deploys compiled report tree to GitHub Pages (bypasses PR builds to prevent site pollution)
      - name: Deploy Report to Github Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          keep_files: true
          force_orphan: true # Isolates commit history to avoid Git lock conflicts
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

  # ============================================================================
  # JOB 5: METRICS ANALYSIS & EMAIL NOTIFICATION
  # Parses test statistics and sends structured HTML metrics email to stakeholders.
  # ============================================================================
  analyze-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [merge-report]
    if: always()

    steps:
      # Checkout required to access repository root assets (email_template.html)
      - uses: actions/checkout@v4

      - name: Aggregate JSON Metrics
        uses: actions/download-artifact@v5
        with:
          pattern: "playwright-report-*"
          path: reports
          merge-multiple: true

      # Extracts high-level counts directly from Playwright JSON reporters via jq
      - name: Extract Detailed Metrics
        id: analysis
        run: |
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          FILES=$(find reports -name "report.json")
          if [ -z "$FILES" ]; then echo "No reports found"; exit 1; fi

          for file in $FILES; do
            T=$(jq '.stats.expected + .stats.unexpected + .stats.skipped' "$file" || echo 0)
            F=$(jq '.stats.unexpected' "$file" || echo 0)
            S=$(jq '.stats.skipped' "$file" || echo 0)
            TOTAL=$((TOTAL + T)); FAILED=$((FAILED + F)); SKIPPED=$((SKIPPED + S))
          done
          PASSED=$((TOTAL - FAILED - SKIPPED))

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "status=$([[ $FAILED -eq 0 ]] && echo 'PASSED' || echo 'FAILED')" >> $GITHUB_OUTPUT

      # Injects dynamic run stats into local HTML email template
      - name: Prepare HTML Email Template
        run: |
          if [ ! -f "utils/reporting/email_template.html" ]; then
            echo "Error: email_template.html not found in repo root!"
            exit 1
          fi

          sed -i "s/\${STATUS}/${{ steps.analysis.outputs.status }}/g" utils/reporting/email_template.html
          sed -i "s/\${TOTAL}/${{ steps.analysis.outputs.total }}/g" utils/reporting/email_template.html
          sed -i "s/\${PASSED}/${{ steps.analysis.outputs.passed }}/g" utils/reporting/email_template.html
          sed -i "s/\${FAILED}/${{ steps.analysis.outputs.failed }}/g" utils/reporting/email_template.html
          sed -i "s/\${TIMESTAMP}/$(date +'%Y-%m-%d %H:%M:%S')/g" utils/reporting/email_template.html
          sed -i "s/\${RUN_ID}/${{ github.run_id }}/g" utils/reporting/email_template.html

      # Transmits final notification report to target email distribution list
      - name: Send Stakeholder Email
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Automation Report] Playwright E-Commerce Engine - Build #${{ github.run_id }} - Status: ${{ steps.analysis.outputs.status }}"
          to: yadavdeepak@outlook.com,kozonhq@gmail.com
          from: Playwright Automation Team
          html_body: file://utils/reporting/email_template.html