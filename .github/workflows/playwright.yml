# ==============================================================================
# Pipeline: Playwright Multi-Stage E2E Test Execution & Reporting
# Maintainer: Automation QA Team
# Architecture Overview:
#   1. Selective Triggering (PR vs Push vs Schedule vs Manual)
#   2. Parallel Matrix Sharding for Execution Speed
#   3. Consolidated Allure History & Single-Source-of-Truth Deployment
#   4. Dynamic Metrics Extraction & Stakeholder Notification
# ==============================================================================

name: Playwright e2e Test Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 2,4"

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: SMOKE TESTS (PR Gate)
  # ============================================================================
  smoke-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Clean Test Results Directories
        run: |
          rm -rf allure-results test-results 
          mkdir -p allure-results test-results

      - name: Run Smoke Tests
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ESS_USER: ${{ secrets.ESS_USER }}
          ESS_PASS: ${{ secrets.ESS_PASS }}
        run: |
          npx playwright test --retries=1 \
          --project=smoke-chromium \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Copy Allure Categories
        if: always()
        run: |
          mkdir -p allure-results 
          cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        if: always()
        run: |
          if [ ! -d "allure-results" ]; then
            echo "::warning::Allure results directory missing."
          fi

      - name: Upload Raw Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      - name: Upload Playwright JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-json-smoke-${{ matrix.shardIndex }}
          path: test-results/report.json
          retention-days: 60

  # ============================================================================
  # JOB 2: REGRESSION TESTS (Post-Merge Validation)
  # ============================================================================
  regression-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Clean Test Results Directories
        run: |
          rm -rf allure-results test-results 
          mkdir -p allure-results test-results

      - name: Run Regression Tests
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ESS_USER: ${{ secrets.ESS_USER }}
          ESS_PASS: ${{ secrets.ESS_PASS }}
        run: |
          npx playwright test --retries=1 \
          --project=regression-chromium \
          --project=regression-firefox \
          --project=regression-webkit \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Copy Allure Categories
        if: always()
        run: |
          mkdir -p allure-results
          cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        if: always()
        run: |
          if [ ! -d "allure-results" ]; then
            echo "::warning::Allure results directory missing."
          fi

      - name: Upload Raw Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      - name: Upload Playwright JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-json-regression-${{ matrix.shardIndex }}
          path: test-results/report.json
          retention-days: 60

  # ============================================================================
  # JOB 3: NIGHTLY FULL SUITE (Scheduled Health Check)
  # ============================================================================
  nightly-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Clean Test Results Directories
        run: |
          rm -rf allure-results test-results 
          mkdir -p allure-results test-results

      - name: Run Full Suite
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ESS_USER: ${{ secrets.ESS_USER }}
          ESS_PASS: ${{ secrets.ESS_PASS }}
        run: |
          npx playwright test --retries=1 \
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Copy Allure Categories
        if: always()
        run: |
          mkdir -p allure-results
          cp data/issue-categories.json allure-results/ || true

      - name: Validate Allure Results Before Upload
        if: always()
        run: |
          if [ ! -d "allure-results" ]; then
            echo "::warning::Allure results directory missing."
          fi

      - name: Upload Raw Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-allure-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 60

      - name: Upload Playwright JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-json-nightly-${{ matrix.shardIndex }}
          path: test-results/report.json
          retention-days: 60

  # ============================================================================
  # JOB 4: REPORT CONSOLIDATION & PUBLISHING
  # ============================================================================
  merge-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - smoke-tests
      - regression-tests
      - nightly-tests
    if: >
      always() &&
      !cancelled() &&
      (
        needs.smoke-tests.result != 'skipped' ||
        needs.regression-tests.result != 'skipped' ||
        needs.nightly-tests.result != 'skipped'
      )
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Raw Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-allure-*"
          path: all-results
          merge-multiple: true

      - name: Validate Allure Results Exist
        run: |
          if [ ! -d "all-results" ] || [ -z "$(ls -A all-results)" ]; then
            echo "No Allure results found. Skipping report generation."
            exit 0
          fi

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: all-results
          gh_pages: gh-pages
          subfolder: allure-results
          allure_report: allure-report
          allure_history: allure-history
          allure_version: 2.29.0
          keep_reports: 30

      - name: Deploy Report to Github Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          keep_files: true
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

  # ============================================================================
  # JOB 5: EMAIL NOTIFICATION DISPATCH
  # ============================================================================
  send-email-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - merge-report
      - smoke-tests
      - regression-tests
      - nightly-tests
    if: >
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (
        needs.smoke-tests.result != 'skipped' ||
        needs.regression-tests.result != 'skipped' ||
        needs.nightly-tests.result != 'skipped'
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download Playwright JSON Report Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "playwright-json-*"
          path: test-results

      - name: Send Email Report
        env:
          TEST_ENV: "QA-Staging"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.MAIL_USERNAME }}
          SMTP_PASS: ${{ secrets.MAIL_PASSWORD }}
          EMAIL_STAKEHOLDERS: "yadavdeepak@outlook.com,kozonhq@gmail.com"
        run: npx tsx scripts/send-email-report.ts